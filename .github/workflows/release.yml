name: Build & release

# Builds the plugin on every push/PR. A release (with main.js, manifest.json and
# styles.css attached, as needed by BRAT and manual installs) is created when a
# version tag is pushed (e.g. 1.3.1 – the release then gets that version, see
# scripts/set-version.mjs), or manually via "Run workflow" (version from
# manifest.json).
on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release for the version in manifest.json"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from the tag
        # a release's manifest.json must match its tag – BRAT and Obsidian compare the two
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/set-version.mjs "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ink-notebook
          path: |
            main.js
            manifest.json
            styles.css

      - name: Read version
        id: version
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release)
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.version }}
          name: Ink Notebook ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
