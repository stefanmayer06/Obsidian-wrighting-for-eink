name: Build & release

# Builds the plugin on every push/PR. A release (with main.js, manifest.json and
# styles.css attached, as needed by BRAT and manual installs) is created when a
# version tag is pushed (e.g. 1.3.1 – it must be the version in manifest.json,
# see scripts/set-version.mjs), or manually via "Run workflow" (version from
# manifest.json). Releases are made only from commits that are on main: a tag
# on another commit, or "Run workflow" on another branch, fails the release job.
# The released files get a build provenance attestation (gh attestation verify).
#
# Test builds: "Run workflow" on any branch with "test build" ticked publishes
# that branch as a pre-release tagged test-build (replacing the previous one),
# for testers who pick that version in BRAT. Nobody else gets it: Obsidian goes
# by the manifest.json on main, which a test build does not change, and BRAT's
# "latest" ranks releases by the version in their tag – a tag without digits
# never ranks above a real version.
on:
  push:
    branches: ["**"]
    tags: ["*", "!test-build"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release for the version in manifest.json (from main only)"
        type: boolean
        default: true
      test:
        description: "Instead, publish a test build of this branch for BRAT (pre-release \"test-build\"; users of the released plugin do not get it)"
        type: boolean
        default: false

# read-only by default; only the release jobs may write
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The tag must be the version in manifest.json
        # the released manifest.json is the repository's: BRAT and Obsidian compare it with the tag and the repository
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the version in manifest.json ($version). Run 'npm run set-version -- $GITHUB_REF_NAME', merge that into main and tag the commit on main."
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ink-notebook
          path: |
            main.js
            manifest.json
            styles.css

  release:
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.release && !inputs.test)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # build provenance attestations for the released files
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only release commits that are on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Releases are made from main only. $GITHUB_SHA ($GITHUB_REF) is not on main – merge it into main first, then tag the commit on main."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ink-notebook

      - name: Attest the released files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.version }}
          name: Ink Notebook ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css

  test-build:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # no digits: BRAT reads a version out of a tag, and one without any never counts as newer than a real release
      TAG: test-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ink-notebook

      - name: Replace the previous test build
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Publish the test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test build of ${{ github.ref_name }} (not a release)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            A test build of the branch `${{ github.ref_name }}` (${{ github.sha }}) – not a release, and not for general use.

            Only those who choose it get it: install it with BRAT (*Settings → BRAT → Add beta plugin*, `${{ github.repository }}`, version `test-build`). Users of the released plugin – from Obsidian's community plugins or with BRAT's latest version – stay on the latest release.

            To go back, pick the latest release's version in BRAT the same way. Running the workflow again with "test build" replaces this build.
          files: |
            main.js
            manifest.json
            styles.css
